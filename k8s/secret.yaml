# API key secret — DO NOT commit real keys to Git.
#
# This file is a template. Create the actual secret in each namespace:
#
#   kubectl create secret generic bank-marketing-api-key \
#     --from-literal=API_KEY=<your-secure-key> \
#     -n bank-marketing
#
#   kubectl create secret generic bank-marketing-api-key \
#     --from-literal=API_KEY=<your-secure-key> \
#     -n bank-marketing-dev
#
# In CI/CD, use a pipeline variable or Azure Key Vault to inject the key.

apiVersion: v1
kind: Secret
metadata:
  name: bank-marketing-api-key
type: Opaque
stringData:
  API_KEY: REPLACE_WITH_SECURE_KEY
