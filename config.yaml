data:
  raw_path: data/raw/bank_marketing_data.csv
  separator: ;
  index_col: 0
features:
  age_cap: 100
  log_transform_cols:
    - duration
    - campaign
  signed_log_cols:
    - balance
  drop_cols:
    - post_campaign_action
model:
  target_column: target
  type: logistic_regression # Options: logistic_regression, gradient_boosting, random_forest
  test_size: 0.2
  random_state: 42
artifacts:
  model_path: artifacts/model.pkl
  metrics_path: artifacts/metrics.json
