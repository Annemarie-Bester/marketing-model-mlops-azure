# azure-pipelines.yml
# Push-triggered CI/CD pipeline.
# Branch strategy:
#   dev   → build + push ACR (dev-<sha>) → deploy bank-marketing-dev namespace
#   main  → build + push ACR (latest + <sha>) → deploy bank-marketing namespace
#
# Stage dependency chain:
#   CI → TrainModel → CD_Dev (dev branch only) | CD_Main (main branch only)

trigger:
  branches:
    include:
      - dev
      - main
  paths:
    exclude:
      - docs/**
      - "*.md"

pr: none

variables:
  - group: bank-marketing-vars
  # Pipeline-local convenience aliases
  - name: IS_DEV
    value: ${{ eq(variables['Build.SourceBranchName'], 'dev') }}
  - name: IS_MAIN
    value: ${{ eq(variables['Build.SourceBranchName'], 'main') }}

stages:
  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1: CI — install, test, validate manifests
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CI
    displayName: Continuous Integration
    jobs:
      - job: Test
        displayName: Test & Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: "3.12"

          - script: pip install --no-cache-dir -r requirements-local.txt
            displayName: Install Python dependencies (full dev environment incl. pytest)

          - script: |
              pip install pip-audit
              pip-audit -r requirements.txt
              pip-audit -r requirements-infer.txt
            displayName: Dependency vulnerability scan (pip-audit)

          - script: python -m pytest tests/ -v --tb=short
            displayName: Run test suite

          - script: |
              curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
                | tar -xz -C /usr/local/bin
              kubeconform -summary -strict k8s/
            displayName: Validate Kubernetes manifests (kubeconform)

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 2: TrainModel — build training image, run training, push to ACR,
  #          publish model.pkl + metrics.json as a pipeline artifact for CD stages
  # ══════════════════════════════════════════════════════════════════════════
  - stage: TrainModel
    displayName: Train Model
    dependsOn: CI
    jobs:
      - job: Train
        displayName: Build & Run Training Container
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Log in to ACR
            inputs:
              command: login
              containerRegistry: $(ACR_SERVICE_CONNECTION)

          - task: Docker@2
            displayName: Build training image
            inputs:
              command: buildAndPush
              repository: $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME)
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              Dockerfile: Dockerfile.train
              tags: |
                $(Build.BuildId)
                train-latest

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sh -s -- -b /usr/local/bin
              trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):$(Build.BuildId)
            displayName: Container vulnerability scan — training image (Trivy)

          - script: |
              mkdir -p artifacts
              docker run --rm \
                -v $(Build.SourcesDirectory)/data:/app/data \
                -v $(Build.SourcesDirectory)/artifacts:/app/artifacts \
                $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):$(Build.BuildId)
            displayName: Run training container — produce model.pkl

          - script: |
              ls -lh artifacts/model.pkl
              ls -lh artifacts/metrics.json
            displayName: Verify training artifacts

          # Push training image to ACR — used by retrain.yml (pull train-latest, no rebuild)
          - task: Docker@2
            displayName: Push training image to ACR
            inputs:
              command: push
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: $(TRAIN_IMAGE_NAME)
              tags: |
                $(Build.BuildId)
                train-latest

          # Publish model artifacts so CD stages can download without re-running training
          - publish: $(Build.SourcesDirectory)/artifacts
            artifact: model-artifacts
            displayName: Publish model artifacts

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3a: CD_Dev — runs only on the dev branch
  #            Downloads model artifacts → bakes into inference image →
  #            pushes to ACR as dev-<sha> → deploys to bank-marketing-dev
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CD_Dev
    displayName: Deploy to Dev (Staging)
    dependsOn: TrainModel
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - deployment: DeployDev
        displayName: Deploy to bank-marketing-dev
        pool:
          vmImage: ubuntu-latest
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                # Download model.pkl + metrics.json produced in TrainModel stage
                - download: current
                  artifact: model-artifacts
                  displayName: Download model artifacts

                - script: |
                    mkdir -p $(Build.SourcesDirectory)/artifacts
                    cp $(Pipeline.Workspace)/model-artifacts/* $(Build.SourcesDirectory)/artifacts/
                  displayName: Stage model artifacts for Docker build

                - task: Docker@2
                  displayName: Build and push inference image (dev)
                  inputs:
                    command: buildAndPush
                    repository: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME)
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    Dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    tags: |
                      dev-$(Build.BuildId)
                      dev-latest

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):dev-$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing-dev namespace
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing-dev
                    manifests: $(Build.SourcesDirectory)/k8s/deployment-dev.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):dev-$(Build.BuildId)

                # In-cluster smoke test — no external LoadBalancer IP required
                - task: AzureCLI@2
                  displayName: Smoke test — /health (in-cluster)
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      STATUS=$(kubectl exec -n bank-marketing-dev \
                        deploy/bank-marketing-api -- \
                        curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
                      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
                      echo "Smoke test passed: HTTP $STATUS"

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3b: CD_Main — runs only on the main branch
  #            Downloads model artifacts → bakes into inference image →
  #            pushes to ACR as <sha> + latest → deploys to bank-marketing
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CD_Main
    displayName: Deploy to Production
    dependsOn: TrainModel
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
      - deployment: DeployMain
        displayName: Deploy to bank-marketing (production)
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                # Download model.pkl + metrics.json produced in TrainModel stage
                - download: current
                  artifact: model-artifacts
                  displayName: Download model artifacts

                - script: |
                    mkdir -p $(Build.SourcesDirectory)/artifacts
                    cp $(Pipeline.Workspace)/model-artifacts/* $(Build.SourcesDirectory)/artifacts/
                  displayName: Stage model artifacts for Docker build

                - task: Docker@2
                  displayName: Build and push inference image (production)
                  inputs:
                    command: buildAndPush
                    Dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    repository: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME)
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    tags: |
                      $(Build.BuildId)
                      latest

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing namespace (production)
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing
                    manifests: $(Build.SourcesDirectory)/k8s/deployment.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):$(Build.BuildId)

                # Live smoke test against the production LoadBalancer
                - task: AzureCLI@2
                  displayName: Smoke test — /health (production)
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      # Wait for LoadBalancer IP to be assigned (up to 2 minutes)
                      for i in $(seq 1 12); do
                        SVC_IP=$(kubectl get svc bank-marketing-api -n bank-marketing \
                          -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                        [ -n "$SVC_IP" ] && break
                        echo "Waiting for LoadBalancer IP... ($i/12)"
                        sleep 10
                      done
                      [ -n "$SVC_IP" ] || (echo "LoadBalancer IP not assigned" && exit 1)
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SVC_IP/health)
                      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
                      echo "Smoke test passed: http://$SVC_IP/health → HTTP $STATUS"
