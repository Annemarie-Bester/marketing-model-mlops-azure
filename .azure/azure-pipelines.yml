# azure-pipelines.yml
# Push-triggered CI/CD pipeline.
# Branch strategy:
#   dev   → build + push ACR (dev-<sha>) → deploy bank-marketing-dev namespace
#   main  → build + push ACR (latest + <sha>) → deploy bank-marketing namespace
#
# Stage dependency chain:
#   CI (test + detect changes) → TrainModel (conditional) → CD_Dev | CD_Main
#
# TrainModel is skipped when only inference-relevant files changed.
# CD stages always run (they check whether training ran to decide on model promotion).

trigger:
  branches:
    include:
      - dev
      - main
  paths:
    exclude:
      - docs/**
      - "*.md"

pr: none

variables:
  - group: bank-marketing-vars
  # Pipeline-local convenience aliases
  - name: IS_DEV
    value: ${{ eq(variables['Build.SourceBranchName'], 'dev') }}
  - name: IS_MAIN
    value: ${{ eq(variables['Build.SourceBranchName'], 'main') }}

stages:
  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1: CI — install, test, validate manifests
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CI
    displayName: Continuous Integration
    jobs:
      - job: Test
        displayName: Test & Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: "3.12"

          - script: pip install --no-cache-dir -r requirements-local.txt
            displayName: Install Python dependencies (full dev environment incl. pytest)

          - script: |
              pip install pip-audit
              pip-audit -r requirements.txt
              pip-audit -r requirements-infer.txt
            displayName: Dependency vulnerability scan (pip-audit)

          - script: python -m pytest tests/ -v --tb=short
            displayName: Run test suite

          - script: |
              curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
                | tar -xz -C /usr/local/bin
              kubeconform -summary -strict k8s/
            displayName: Validate Kubernetes manifests (kubeconform)

      # Detect which files changed to decide whether TrainModel is needed.
      # Training is required when ML pipeline code, training deps, config, or
      # Dockerfile.train changed. API-only or K8s-only changes skip training.
      - job: DetectChanges
        displayName: Detect Changed Files
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              TRAIN_PATHS="src/data.py src/features.py src/train.py src/evaluate.py src/config.py src/storage.py config.yaml requirements.txt main.py Dockerfile.train"
              CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "FORCE_TRAIN")
              echo "Changed files:"
              echo "$CHANGED"
              NEEDS_TRAIN=false

              # Force training if: git diff fails, commit message contains [train], or train-relevant files changed
              if echo "$CHANGED" | grep -q "FORCE_TRAIN"; then
                NEEDS_TRAIN=true
                echo "Forcing training (unable to determine changed files)"
              elif echo "$(Build.SourceVersionMessage)" | grep -qi "\[train\]"; then
                NEEDS_TRAIN=true
                echo "Forcing training ([train] found in commit message)"
              else
                for path in $TRAIN_PATHS; do
                  if echo "$CHANGED" | grep -q "^${path}$"; then
                    NEEDS_TRAIN=true
                    echo "Training required: $path changed"
                    break
                  fi
                done
              fi

              echo "NEEDS_TRAIN=$NEEDS_TRAIN"
              echo "##vso[task.setvariable variable=NEEDS_TRAIN;isOutput=true]$NEEDS_TRAIN"
            name: detect
            displayName: Check if training-relevant files changed

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 2: TrainModel — build training image, run training, push to ACR,
  #          upload model.pkl + metrics.json to Blob Storage (model registry),
  #          and publish as pipeline artifact for CD stage visibility
  # ══════════════════════════════════════════════════════════════════════════
  - stage: TrainModel
    displayName: Train Model
    dependsOn: CI
    condition: and(succeeded(), eq(dependencies.CI.outputs['DetectChanges.detect.NEEDS_TRAIN'], 'true'))
    jobs:
      - job: Train
        displayName: Build & Run Training Container
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Log in to ACR
            inputs:
              command: login
              containerRegistry: $(ACR_SERVICE_CONNECTION)

          - task: Docker@2
            displayName: Build training image
            inputs:
              command: buildAndPush
              repository: $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME)
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              Dockerfile: Dockerfile.train
              tags: |
                $(Build.BuildId)
                train-latest

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sh -s -- -b /usr/local/bin
              trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):$(Build.BuildId)
            displayName: Container vulnerability scan — training image (Trivy)

          # Download training data from Blob Storage (single source of truth)
          - task: AzureCLI@2
            displayName: Download training data from Blob Storage
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                mkdir -p data/raw
                az storage blob download \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_TRAINING) \
                  --name latest/bank_marketing_data.csv \
                  --file data/raw/bank_marketing_data.csv \
                  --auth-mode login

          - script: |
              mkdir -p artifacts
              docker run --rm \
                -v $(Build.SourcesDirectory)/data:/app/data \
                -v $(Build.SourcesDirectory)/artifacts:/app/artifacts \
                $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):$(Build.BuildId)
            displayName: Run training container — produce model.pkl

          - script: |
              ls -lh artifacts/model.pkl
              ls -lh artifacts/metrics.json
            displayName: Verify training artifacts

          # Upload model artifacts to Blob Storage (model registry)
          - task: AzureCLI@2
            displayName: Upload model artifacts to Blob Storage (model registry)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az storage blob upload \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_REGISTRY) \
                  --name "builds/$(Build.BuildId)/model.pkl" \
                  --file artifacts/model.pkl \
                  --auth-mode login
                az storage blob upload \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_REGISTRY) \
                  --name "builds/$(Build.BuildId)/metrics.json" \
                  --file artifacts/metrics.json \
                  --auth-mode login
                echo "Model artifacts uploaded to $(BLOB_CONTAINER_REGISTRY)/builds/$(Build.BuildId)/"

          # Push training image to ACR — used by retrain.yml (pull train-latest, no rebuild)
          - task: Docker@2
            displayName: Push training image to ACR
            inputs:
              command: push
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: $(TRAIN_IMAGE_NAME)
              tags: |
                $(Build.BuildId)
                train-latest

          # Publish model artifacts as pipeline artifact (audit trail + CD stage access)
          - publish: $(Build.SourcesDirectory)/artifacts
            artifact: model-artifacts
            displayName: Publish model artifacts

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3a: CD_Dev — runs only on the dev branch
  #            Promotes model to staging/ in Blob Storage → builds inference
  #            image → pushes to ACR as dev-<sha> → deploys to bank-marketing-dev
  #            (model loaded from Blob at runtime, not baked into image)
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CD_Dev
    displayName: Deploy to Dev (Staging)
    dependsOn:
      - CI
      - TrainModel
    # Run if CI succeeded AND (TrainModel succeeded OR was skipped)
    condition: |
      and(
        eq(variables['Build.SourceBranchName'], 'dev'),
        in(dependencies.CI.result, 'Succeeded'),
        in(dependencies.TrainModel.result, 'Succeeded', 'Skipped')
      )
    variables:
      TRAINING_RAN: $[ in(dependencies.TrainModel.result, 'Succeeded') ]
    jobs:
      - deployment: DeployDev
        displayName: Deploy to bank-marketing-dev
        pool:
          vmImage: ubuntu-latest
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                # Promote model to staging/ in Blob Storage — only when training produced a new model
                - task: AzureCLI@2
                  displayName: Promote model to staging in Blob Storage
                  condition: eq(variables['TRAINING_RAN'], 'True')
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "staging/artifacts/model.pkl" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/$(Build.BuildId)/model.pkl" \
                        --auth-mode login
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "staging/artifacts/metrics.json" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/$(Build.BuildId)/metrics.json" \
                        --auth-mode login
                      echo "Model promoted to $(BLOB_CONTAINER_REGISTRY)/staging/artifacts/"

                - task: Docker@2
                  displayName: Build and push inference image (dev)
                  inputs:
                    command: buildAndPush
                    repository: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME)
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    Dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    tags: |
                      dev-$(Build.BuildId)
                      dev-latest

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):dev-$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing-dev namespace
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing-dev
                    manifests: $(Build.SourcesDirectory)/k8s/deployment-dev.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):dev-$(Build.BuildId)

                # In-cluster smoke test — no external LoadBalancer IP required
                - task: AzureCLI@2
                  displayName: Smoke test — /health (in-cluster)
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      STATUS=$(kubectl exec -n bank-marketing-dev \
                        deploy/bank-marketing-api -- \
                        curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
                      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
                      echo "Smoke test passed: HTTP $STATUS"

                # Rolling restart to pick up new model from Blob Storage
                # (needed when training ran and promoted a new model; harmless when skipped)
                - task: AzureCLI@2
                  displayName: Rolling restart — pick up new model
                  condition: eq(variables['TRAINING_RAN'], 'True')
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      kubectl rollout restart deployment/bank-marketing-api -n bank-marketing-dev
                      kubectl rollout status deployment/bank-marketing-api -n bank-marketing-dev --timeout=120s
                      echo "Rolling restart complete — pods reloaded model from Blob Storage"

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3b: CD_Main — runs only on the main branch
  #            Promotes model to production/ in Blob Storage → builds inference
  #            image → pushes to ACR as <sha> + latest → deploys to bank-marketing
  #            (model loaded from Blob at runtime, not baked into image)
  # ══════════════════════════════════════════════════════════════════════════
  - stage: CD_Main
    displayName: Deploy to Production
    dependsOn:
      - CI
      - TrainModel
    # Run if CI succeeded AND (TrainModel succeeded OR was skipped)
    condition: |
      and(
        eq(variables['Build.SourceBranchName'], 'main'),
        in(dependencies.CI.result, 'Succeeded'),
        in(dependencies.TrainModel.result, 'Succeeded', 'Skipped')
      )
    variables:
      TRAINING_RAN: $[ in(dependencies.TrainModel.result, 'Succeeded') ]
    jobs:
      - deployment: DeployMain
        displayName: Deploy to bank-marketing (production)
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                # Download pipeline artifact (needed for metrics.json baseline update)
                - download: current
                  artifact: model-artifacts
                  displayName: Download model artifacts
                  condition: eq(variables['TRAINING_RAN'], 'True')

                # Promote model to production/ in Blob Storage — only when training produced a new model
                - task: AzureCLI@2
                  displayName: Promote model to production in Blob Storage
                  condition: eq(variables['TRAINING_RAN'], 'True')
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "production/artifacts/model.pkl" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/$(Build.BuildId)/model.pkl" \
                        --auth-mode login
                      az storage blob upload \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --container-name $(BLOB_CONTAINER_REGISTRY) \
                        --name "production/artifacts/metrics.json" \
                        --file $(Pipeline.Workspace)/model-artifacts/metrics.json \
                        --overwrite \
                        --auth-mode login
                      echo "Model promoted to $(BLOB_CONTAINER_REGISTRY)/production/artifacts/"

                - task: Docker@2
                  displayName: Build and push inference image (production)
                  inputs:
                    command: buildAndPush
                    Dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    repository: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME)
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    tags: |
                      $(Build.BuildId)
                      latest

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing namespace (production)
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing
                    manifests: $(Build.SourcesDirectory)/k8s/deployment.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):$(Build.BuildId)

                # Live smoke test against the production LoadBalancer
                - task: AzureCLI@2
                  displayName: Smoke test — /health (production)
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      # Wait for LoadBalancer IP to be assigned (up to 2 minutes)
                      for i in $(seq 1 12); do
                        SVC_IP=$(kubectl get svc bank-marketing-api -n bank-marketing \
                          -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                        [ -n "$SVC_IP" ] && break
                        echo "Waiting for LoadBalancer IP... ($i/12)"
                        sleep 10
                      done
                      [ -n "$SVC_IP" ] || (echo "LoadBalancer IP not assigned" && exit 1)
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SVC_IP/health)
                      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
                      echo "Smoke test passed: http://$SVC_IP/health → HTTP $STATUS"

                # Rolling restart to pick up new model from Blob Storage
                - task: AzureCLI@2
                  displayName: Rolling restart — pick up new model
                  condition: eq(variables['TRAINING_RAN'], 'True')
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      kubectl rollout restart deployment/bank-marketing-api -n bank-marketing
                      kubectl rollout status deployment/bank-marketing-api -n bank-marketing --timeout=120s
                      echo "Rolling restart complete — pods reloaded model from Blob Storage"
