# retrain.yml
# Standalone retraining pipeline — not triggered by code pushes.
#
# Trigger modes:
#   1. Manual     — ADO UI → Pipelines → retrain → Run pipeline
#   2. Scheduled  — weekly cron (Sunday 02:00 UTC)
#   3. Event-driven (future) — POST to ADO Pipelines REST API from drift alert
#
# Prerequisite: TrainModel stage in azure-pipelines.yml must have pushed
#               $(TRAIN_IMAGE_NAME):train-latest to ACR.
#
# Data source: Azure Blob Storage account $(BLOB_STORAGE_ACCOUNT),
#              container $(BLOB_CONTAINER_TRAINING).
#              Pass a date-prefixed blob path via `dataBlob` parameter for
#              versioned data; defaults to latest/.

trigger: none

schedules:
  - cron: "0 2 * * 0" # Weekly — Sunday 02:00 UTC
    displayName: Weekly scheduled retraining
    branches:
      include:
        - main
    always: true # Run even if no code changes since last run

parameters:
  - name: dataBlob
    displayName: "Blob path to training data (e.g. 2026-03-24/bank_marketing_data.csv)"
    type: string
    default: latest/bank_marketing_data.csv

variables:
  - group: bank-marketing-vars

pool:
  vmImage: ubuntu-latest

stages:
  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1: Retrain
  #   - Download training data from Blob Storage (versioned path)
  #   - Pull stable training image from ACR (train-latest — no rebuild)
  #   - Run training container
  #   - Publish model artifacts for downstream stages
  # ══════════════════════════════════════════════════════════════════════════
  - stage: Retrain
    displayName: Train Model
    jobs:
      - job: RunTraining
        displayName: Pull train-latest & run
        steps:
          # Download versioned training data from Blob Storage onto agent
          - task: AzureCLI@2
            displayName: Download training data from Blob Storage
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                mkdir -p data/raw
                az storage blob download \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_TRAINING) \
                  --name "${{ parameters.dataBlob }}" \
                  --file data/raw/bank_marketing_data.csv \
                  --auth-mode login

          # Pull the stable training image from ACR — avoids a rebuild on every retrain
          - task: Docker@2
            displayName: Pull training image from ACR (train-latest)
            inputs:
              command: pull
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              arguments: $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):train-latest

          # Run training — produces model.pkl + metrics.json on the agent
          - script: |
              mkdir -p artifacts
              docker run --rm \
                -v $(Build.SourcesDirectory)/data:/app/data \
                -v $(Build.SourcesDirectory)/artifacts:/app/artifacts \
                $(ACR_NAME).azurecr.io/$(TRAIN_IMAGE_NAME):train-latest
            displayName: Run training container

          - script: |
              ls -lh artifacts/model.pkl
              ls -lh artifacts/metrics.json
            displayName: Verify training artifacts

          # Publish artifacts so ValidateModel + Deploy stages can download them
          - publish: $(Build.SourcesDirectory)/artifacts
            artifact: model-artifacts
            displayName: Publish model artifacts

          # Upload model artifacts to Blob Storage (model registry) — versioned by build ID
          - task: AzureCLI@2
            displayName: Upload model artifacts to Blob Storage (model registry)
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az storage blob upload \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_REGISTRY) \
                  --name "builds/retrain-$(Build.BuildId)/model.pkl" \
                  --file artifacts/model.pkl \
                  --auth-mode login
                az storage blob upload \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_REGISTRY) \
                  --name "builds/retrain-$(Build.BuildId)/metrics.json" \
                  --file artifacts/metrics.json \
                  --auth-mode login
                echo "Model artifacts uploaded to $(BLOB_CONTAINER_REGISTRY)/builds/retrain-$(Build.BuildId)/"

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 2: ValidateModel
  #   - Download production baseline metrics from Blob Storage
  #   - Compare new ROC-AUC against baseline
  #   - Fail (block deployment) if regression > 2%
  # ══════════════════════════════════════════════════════════════════════════
  - stage: ValidateModel
    displayName: Validate Model Quality
    dependsOn: Retrain
    jobs:
      - job: CompareMetrics
        displayName: Quality gate — ROC-AUC comparison
        steps:
          - download: current
            artifact: model-artifacts
            displayName: Download new model artifacts

          # Download baseline metrics written by the previous successful retrain run.
          # Falls back to empty dict on first run (no baseline yet).
          - task: AzureCLI@2
            displayName: Fetch production baseline metrics
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az storage blob download \
                  --account-name $(BLOB_STORAGE_ACCOUNT) \
                  --container-name $(BLOB_CONTAINER_REGISTRY) \
                  --name production/artifacts/metrics.json \
                  --file baseline_metrics.json \
                  --auth-mode login \
                || echo '{}' > baseline_metrics.json

          # Fail the stage if ROC-AUC regresses more than 2 percentage points
          - script: |
              python - <<'EOF'
              import json, sys
              new  = json.load(open('$(Pipeline.Workspace)/model-artifacts/metrics.json'))
              base = json.load(open('baseline_metrics.json'))
              if not base:
                  print('No baseline found — first retrain run, skipping comparison')
                  sys.exit(0)
              roc_new  = new['roc_auc']
              roc_base = base.get('roc_auc', 0)
              if roc_new < roc_base - 0.02:
                  print(f'FAIL: ROC-AUC regressed {roc_base:.4f} → {roc_new:.4f} (threshold: -0.02)')
                  sys.exit(1)
              print(f'PASS: ROC-AUC {roc_base:.4f} → {roc_new:.4f}')
              EOF
            displayName: Quality gate — compare ROC-AUC to baseline

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3: DeployStaging
  #   - Promote model to staging/ in Blob Storage
  #   - Build inference image, push to ACR as retrain-staging-<buildId>
  #   - Deploy to bank-marketing-dev namespace
  #   - In-cluster smoke test before gating production
  #   (model loaded from Blob at runtime, not baked into image)
  # ══════════════════════════════════════════════════════════════════════════
  - stage: DeployStaging
    displayName: Deploy to Staging
    dependsOn: ValidateModel
    jobs:
      - deployment: DeployDev
        displayName: Deploy to bank-marketing-dev
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: model-artifacts
                  displayName: Download model artifacts

                # Promote retrained model to staging/ in Blob Storage
                - task: AzureCLI@2
                  displayName: Promote model to staging in Blob Storage
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "staging/artifacts/model.pkl" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/retrain-$(Build.BuildId)/model.pkl" \
                        --auth-mode login
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "staging/artifacts/metrics.json" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/retrain-$(Build.BuildId)/metrics.json" \
                        --auth-mode login
                      echo "Model promoted to $(BLOB_CONTAINER_REGISTRY)/staging/artifacts/"

                - task: Docker@2
                  displayName: Build and push inference image (staging)
                  inputs:
                    command: buildAndPush
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    repository: $(INFER_IMAGE_NAME)
                    dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    buildContext: $(Build.SourcesDirectory)
                    tags: retrain-staging-$(Build.BuildId)

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):retrain-staging-$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing-dev namespace
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing-dev
                    manifests: $(Build.SourcesDirectory)/k8s/deployment-dev.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):retrain-staging-$(Build.BuildId)

                # In-cluster smoke test — avoids needing an external IP in staging
                - task: AzureCLI@2
                  displayName: Smoke test — /health (staging)
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER) \
                        --overwrite-existing
                      STATUS=$(kubectl exec -n bank-marketing-dev \
                        deploy/bank-marketing-api -- \
                        curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
                      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
                      echo "Smoke test passed: HTTP $STATUS"

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 4: DeployProduction
  #   - Manual approval gate (configured in ADO Environments → production)
  #   - Promote model to production/ in Blob Storage
  #   - Build + push inference image as retrain-<buildId> + latest
  #   - Deploy to bank-marketing namespace (production)
  #   - Persist new metrics as production baseline in Blob Storage
  #   (model loaded from Blob at runtime, not baked into image)
  # ══════════════════════════════════════════════════════════════════════════
  - stage: DeployProduction
    displayName: Deploy to Production
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployProd
        displayName: Deploy to bank-marketing (production)
        environment: production # approval gate configured in ADO Environments
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: model-artifacts
                  displayName: Download model artifacts

                # Promote retrained model to production/ in Blob Storage
                - task: AzureCLI@2
                  displayName: Promote model to production in Blob Storage
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob copy start \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --destination-container $(BLOB_CONTAINER_REGISTRY) \
                        --destination-blob "production/artifacts/model.pkl" \
                        --source-account-name $(BLOB_STORAGE_ACCOUNT) \
                        --source-container $(BLOB_CONTAINER_REGISTRY) \
                        --source-blob "builds/retrain-$(Build.BuildId)/model.pkl" \
                        --auth-mode login
                      echo "Model promoted to $(BLOB_CONTAINER_REGISTRY)/production/artifacts/"

                - task: Docker@2
                  displayName: Build and push inference image (production)
                  inputs:
                    command: buildAndPush
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    repository: $(INFER_IMAGE_NAME)
                    dockerfile: $(Build.SourcesDirectory)/Dockerfile.infer
                    buildContext: $(Build.SourcesDirectory)
                    tags: |
                      retrain-$(Build.BuildId)
                      latest

                - script: |
                    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin
                    trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
                      $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):retrain-$(Build.BuildId)
                  displayName: Container vulnerability scan — inference image (Trivy)

                - task: KubernetesManifest@1
                  displayName: Deploy to bank-marketing namespace (production)
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(AZURE_SUBSCRIPTION)
                    azureResourceGroup: $(RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: bank-marketing
                    manifests: $(Build.SourcesDirectory)/k8s/deployment.yaml
                    containers: $(ACR_NAME).azurecr.io/$(INFER_IMAGE_NAME):retrain-$(Build.BuildId)

                # Persist the retrained model's metrics as the new production baseline.
                # Used by ValidateModel in the next retrain run.
                - task: AzureCLI@2
                  displayName: Update production baseline metrics in Blob Storage
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob upload \
                        --account-name $(BLOB_STORAGE_ACCOUNT) \
                        --container-name $(BLOB_CONTAINER_REGISTRY) \
                        --name production/artifacts/metrics.json \
                        --file $(Pipeline.Workspace)/model-artifacts/metrics.json \
                        --overwrite \
                        --auth-mode login
                      echo "Baseline metrics updated in Blob Storage"
