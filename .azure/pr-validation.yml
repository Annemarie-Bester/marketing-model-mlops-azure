# pr-validation.yml
# Triggered on every PR opened or updated against dev or main.
# Purpose: fast feedback loop — tests, manifest validation, Docker build smoke test.
# No ACR push; no deployment. Training runs locally to guarantee model.pkl exists
# before the inference image build.

trigger: none

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TRAIN_IMAGE: bank-marketing-train:pr-$(Build.BuildId)
  INFER_IMAGE: bank-marketing-api:pr-$(Build.BuildId)

steps:
  # ── 0. Secret scanning ───────────────────────────────────────────────────
  - script: |
      GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
        | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
        | tar -xz -C /usr/local/bin
      gitleaks detect --source . --no-git --redact
    displayName: Secret scanning (gitleaks)

  # ── 1. Python deps ────────────────────────────────────────────────────────
  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: pip install --no-cache-dir -r requirements-local.txt
    displayName: Install Python dependencies (full dev environment incl. pytest)

  # ── 1b. Dependency vulnerability scan ────────────────────────────────────
  - script: |
      pip install pip-audit
      pip-audit -r requirements.txt
      pip-audit -r requirements-infer.txt
    displayName: Dependency vulnerability scan (pip-audit)

  # ── 2. Tests ──────────────────────────────────────────────────────────────
  - script: python -m pytest tests/ -v --tb=short
    displayName: Run test suite

  # ── 3. Kubernetes manifest validation ────────────────────────────────────
  - script: |
      curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C /usr/local/bin
      kubeconform -summary -strict k8s/
    displayName: Validate Kubernetes manifests (kubeconform)

  # ── 4. Build training image ───────────────────────────────────────────────
  - task: Docker@2
    displayName: Build training image
    inputs:
      command: build
      dockerfile: Dockerfile.train
      buildContext: $(Build.SourcesDirectory)
      tags: $(TRAIN_IMAGE)

  # ── 4b. Scan training image (Trivy) ──────────────────────────────────────
  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sh -s -- -b /usr/local/bin
      trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress $(TRAIN_IMAGE)
    displayName: Container vulnerability scan — training image (Trivy)

  # ── 5. Run training — produce model.pkl on agent ──────────────────────────
  - script: |
      mkdir -p artifacts
      docker run --rm \
        -v $(Build.SourcesDirectory)/data:/app/data \
        -v $(Build.SourcesDirectory)/artifacts:/app/artifacts \
        $(TRAIN_IMAGE)
    displayName: Run training container — produce model.pkl

  - script: |
      ls -lh artifacts/model.pkl
      ls -lh artifacts/metrics.json
    displayName: Verify training artifacts

  # ── 6. Build inference image ───────────────────────────────────────────────
  # model.pkl is NOT baked into the image (no COPY in Dockerfile.infer).
  # The smoke test below mounts artifacts/ so the container can load it at runtime.
  - task: Docker@2
    displayName: Build inference image
    inputs:
      command: build
      dockerfile: Dockerfile.infer
      buildContext: $(Build.SourcesDirectory)
      tags: $(INFER_IMAGE)

  # ── 6b. Scan inference image (Trivy) ─────────────────────────────────────
  - script: |
      trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress $(INFER_IMAGE)
    displayName: Container vulnerability scan — inference image (Trivy)

  # ── 7. Container smoke test (local, no cluster needed) ────────────────────
  # Mount artifacts/ so the container can load model.pkl (not baked into image)
  - script: |
      docker run -d --name smoke-test -p 8000:8000 \
        -v $(Build.SourcesDirectory)/artifacts:/app/artifacts \
        $(INFER_IMAGE)
      sleep 5
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
      docker stop smoke-test && docker rm smoke-test
      [ "$STATUS" = "200" ] || (echo "Smoke test failed: HTTP $STATUS" && exit 1)
      echo "Smoke test passed: HTTP $STATUS"
    displayName: Container smoke test — /health
